name = "family-tv-portal"
main = "src/index.ts"
# Pinned so CI can use an R2-only API token (no account lookup). Not a secret.
account_id = "b0689c5fe6811e64249f1328cf0b4bb9"
compatibility_date = "2024-10-22"

# Short address for the portal and the app download (familytv.arshadkazi.ca/tv).
# Wrangler creates the DNS record; workers.dev keeps working for TVs already installed.
routes = [{ pattern = "familytv.arshadkazi.ca", custom_domain = true }]
workers_dev = true

# Create with: npx wrangler d1 create family_tv  (then paste the id below)
[[d1_databases]]
binding = "DB"
database_name = "family_tv"
database_id = "12893bd7-f93d-49b9-8cc0-2472e4f8370a"

# Hosts the TV app at /tv. Upload with:
#   npx wrangler r2 object put family-tv-apps/family-tv.apk --file <apk>
# and the Rust test build (arshad1416/family-tv-rust) at /tvrust:
#   npx wrangler r2 object put family-tv-apps/family-tv-rust.apk --file <apk> --remote
[[r2_buckets]]
binding = "APPS"
bucket_name = "family-tv-apps"

[vars]
# Latest TV app build offered to devices (0 = no update offered).
LATEST_APP_VERSION_CODE = "0"
LATEST_APP_URL = ""
# Redirect URI registered on the Trakt app (only checked by Trakt on token refresh).
TRAKT_REDIRECT_URI = "https://familytv.arshadkazi.ca/trakt"

# Secrets (wrangler secret put):
#   ADMIN_TOKEN  long random string; the admin page asks for it once per browser
#   CONFIG_KEY   base64 of 32 random bytes; encrypts provider logins at rest
#   TRAKT_CLIENT_ID      optional: Trakt app client id (trakt.tv/oauth/applications); enables Trakt sync on the TVs
#   TRAKT_CLIENT_SECRET  optional, older Trakt apps only (new apps are PKCE-only and issue none); only this Worker sees it
#   OPENSUBTITLES_API_KEY  optional; OpenSubtitles.com API key for online subtitles on movies/episodes
#   TMDB_API_KEY           optional; TMDB API key (v3 key or v4 read token) for trailers, season overviews and episode stills
#   TVDB_API_KEY           optional; TheTVDB v4 API key, a fallback when TMDB has no episode still/overview or trailer
#   IPTV_PANEL_API_KEY     optional; 8K Gold reseller panel API key for the Lines page (credits, expiry, renew, new lines)

#   STREMIO_LAB_PUBLISH_TOKEN optional independent namespace-only Lab publisher secret; see STREMIO_LAB_ACTIVATION.md
