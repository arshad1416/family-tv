name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PportalUrl=${{ vars.PORTAL_URL || 'https://example.invalid' }}
      - uses: actions/upload-artifact@v4
        with:
          name: family-tv-apk
          path: android/app/build/outputs/apk/release/*.apk
          # A check build only; releases publish their own APK. 90 days of these filled Actions storage.
          retention-days: 3
